# The repository gate. Runs the same npm scripts as the local pre-push hook (package.json: check, build), so the two cannot drift.
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, unit tests
        run: npm run check
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  # Browser regression suite for the home page (apps/web/e2e). Builds with NEXT_PUBLIC_E2E=1 (test hooks on) and runs against `next start`.
  # Screenshot baselines are per platform; the committed ones are darwin's, so on linux this job runs the semantic regression assertions and skips the
  # screenshot comparisons (noted in the report) until linux baselines exist: run the "E2E snapshots" workflow, commit what it uploads.
  e2e:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Home page e2e
        run: npm run e2e -w @sanchez/web
        env:
          CI: "true"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
